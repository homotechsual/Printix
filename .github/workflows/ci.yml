name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap development tools
        shell: pwsh
        run: .\DevOps\Build\bootstrap.ps1
      - name: Analyze and test source
        shell: pwsh
        run: .\DevOps\Quality\test.ps1
      - name: Generate MDX documentation
        shell: pwsh
        run: .\DevOps\Help\Update-Help.ps1
      - name: Build module
        shell: pwsh
        run: .\DevOps\Build\build.ps1
      - name: Test built module
        shell: pwsh
        run: .\DevOps\Quality\test.ps1 -UseBuiltModule -SkipScriptAnalyzer
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: Printix
          path: Output/Printix/
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: module-docs
          path: docs/Printix/
          if-no-files-found: error
